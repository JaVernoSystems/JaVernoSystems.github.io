<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JaVerno Systems — Coming Soon</title>
  <link rel="icon" type="image/png" href="/assets/images/logo(1).png">

  <style>
    :root {
      --bg: #0f172a;      /* slate-900 */
      --fg: #e5e7eb;      /* gray-200 */
      --muted: #94a3b8;   /* slate-400 */
      --accent: #38bdf8;  /* sky-400 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #1e293b, var(--bg));
      color: var(--fg);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }

    .container {
      max-width: 720px;
    }

    h1 {
      font-size: clamp(2.2rem, 5vw, 3rem);
      font-weight: 600;
      margin-bottom: 0.75rem;
      letter-spacing: 0.02em;
    }

    h1 span {
      color: var(--accent);
    }

    p {
      font-size: 1.05rem;
      line-height: 1.6;
      color: var(--muted);
      margin-bottom: 2rem;
    }

    .status {
      display: inline-block;
      padding: 0.5rem 1rem;
      border: 1px solid rgba(148, 163, 184, 0.25);
      border-radius: 999px;
      font-size: 0.9rem;
      color: var(--fg);
      background: rgba(15, 23, 42, 0.6);
    }

    footer {
      margin-top: 3rem;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main class="container">
    <img src="assets/images/logoTp.png" alt="Javerno Systems">
    <p>
      This site is currently under construction.<br />
      Infrastructure is live, and content is coming online soon.
    </p>

    <div class="status">Status: Initial deployment</div>

    <footer>
      © <span id="year"></span> JaVerno Systems
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
